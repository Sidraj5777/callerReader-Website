# /etc/nginx/sites-available/website.conf
# Recall Radar website - static files (Next.js static export)
#
# Replaces the old "proxy_pass http://127.0.0.1:3000" setup: no Node.js
# process runs for the website any more. Nginx serves the files in
# /opt/recall-radar/website/current (a symlink to the live release).
#
# For production, copy this file and change server_name (recallradar.com).

server {
    listen 80;
    listen [::]:80;
    server_name testrecallradar.com www.testrecallradar.com;
    # Cloudflare connects over HTTPS (Full strict); send plain HTTP there too
    return 301 https://$host$request_uri;
}

server {
    # (Ubuntu 24.04 ships Nginx 1.24, which uses this http2 syntax)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testrecallradar.com www.testrecallradar.com;

    # Cloudflare Origin Certificate - KEEP the paths from your current website.conf
    ssl_certificate     /opt/recall-radar/ssl/origin.pem;
    ssl_certificate_key /opt/recall-radar/ssl/origin.key;

    root  /opt/recall-radar/website/current;
    index index.html;

    # Build files have a content hash in their name, so they never change:
    # let browsers and Cloudflare cache them for a year.
    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages: /about -> about.html, /subscribe/success?session_id=... -> subscribe/success.html
    # HTML is revalidated on every visit so a new deploy shows up immediately.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Shows which release is live (written by deploy-website.sh)
    location = /release.txt {
        add_header Cache-Control "no-store";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
